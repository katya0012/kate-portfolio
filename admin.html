<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Редактор сайта</title>
<style>
:root{--bg:#f4f2ec;--ink:#151515;--line:#dcd8cc;--blue:#286eff;--mut:#7d786b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit;width:100%;padding:.55rem .65rem;border:1px solid var(--line);background:#fff;border-radius:6px}
textarea{resize:vertical}
input[type=color]{padding:2px;height:36px}
input[type=checkbox]{width:auto}
small{color:var(--mut);display:block;margin-top:3px;font-size:12px}
.btn{background:#fff;border:1px solid var(--line);padding:.5rem .85rem;border-radius:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.danger{color:#b3261e}
.btn.sm{padding:.25rem .55rem;font-size:13px}

#login{min-height:100%;display:grid;place-items:center;padding:1.5rem}
#login form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:2rem;width:min(380px,100%);display:grid;gap:1rem}
#login h1{font:400 1.5rem Georgia,serif}
#login .err{color:#b3261e;min-height:1.2em;font-size:13px}

#app{display:none;height:100%;grid-template-rows:auto 1fr}
#app.on{display:grid}
.top{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top b{font:400 1.05rem Georgia,serif;margin-right:auto}
#status{color:var(--mut);font-size:13px}
#status.dirty{color:#b26a00}
.cols{display:grid;grid-template-columns:200px minmax(360px,1fr) minmax(320px,44%);min-height:0}
#side{border-right:1px solid var(--line);padding:.8rem;overflow:auto;display:flex;flex-direction:column;gap:2px;background:#faf9f5}
#side button{text-align:left;padding:.55rem .7rem;border-radius:6px;border:0;background:none}
#side button:hover{background:#eeebe2}
#side button.on{background:var(--ink);color:#fff}
#panel{overflow:auto;padding:1.2rem 1.4rem 4rem}
#panel h2{font:400 1.4rem Georgia,serif;margin-bottom:.3rem}
#panel .lead{color:var(--mut);margin-bottom:1.2rem;max-width:60ch}
#panel h3{font-weight:600;margin:1.6rem 0 .6rem;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.f{display:block;margin:.6rem 0}
.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.list{display:grid;gap:.6rem;margin:.6rem 0}
details.item{background:#fff;border:1px solid var(--line);border-radius:8px}
details.item>summary{list-style:none;display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;cursor:pointer}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::before{content:"›";transition:transform .2s;color:var(--mut)}
details.item[open]>summary::before{transform:rotate(90deg)}
.ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ops{display:flex;gap:4px}
.ibody{padding:.2rem .9rem 1rem;border-top:1px solid var(--line)}
.imgf{display:flex;gap:.8rem;align-items:flex-start;margin:.6rem 0}
.thumb{width:84px;height:84px;flex:none;border-radius:6px;border:1px solid var(--line);background:#e8e4d8 center/cover no-repeat}
.thumb.none::after{content:"нет фото";display:grid;place-items:center;height:100%;font-size:11px;color:var(--mut)}
.imgf .r{flex:1;min-width:0;display:grid;gap:.4rem}
.msg{color:#b3261e}
.gridimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin:.6rem 0}
.gridimgs .thumb{width:100%;height:auto;aspect-ratio:1;position:relative}
.note{background:#fff8e1;border:1px solid #f0dfa0;padding:.7rem .9rem;border-radius:8px;margin:.8rem 0;font-size:13px}

#pv{border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0;background:#e9e6dc}
.pvbar{display:flex;gap:.4rem;padding:.5rem;justify-content:center;background:#faf9f5;border-bottom:1px solid var(--line)}
.pvbar button.on{background:var(--ink);color:#fff}
.pvwrap{overflow:auto;display:flex;justify-content:center;padding:0}
#frame{border:0;background:var(--ivory,#F5F2EA);width:100%;height:100%;transition:width .3s}
.pvwrap.phone{padding:14px 0}
.pvwrap.phone #frame{width:390px;max-width:100%;height:min(100%,780px);border-radius:24px;border:8px solid #111;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;font-size:13px}
#toast.on{opacity:1}
#toast.err{background:#b3261e}
.mtabs{display:none}
@media(max-width:1000px){
  .cols{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:.4rem}
  #side button{white-space:nowrap}
  #pv{display:none;position:fixed;inset:0;z-index:40}
  body.showpv #pv{display:grid}
  .mtabs{display:inline-block}
}
</style>
</head>
<body>

<div id="login">
  <form id="lf">
    <h1>Вход в редактор</h1>
    <p style="color:#7d786b">Эта страница видна только вам. Пароль хранится в настройках Vercel.</p>
    <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" autofocus>
    <div class="err" id="lerr"></div>
    <button class="btn primary" type="submit">Войти</button>
  </form>
</div>

<div id="app">
  <div class="top">
    <b>Редактор сайта</b>
    <span id="status">—</span>
    <button class="btn mtabs" id="btnPv" type="button">Просмотр</button>
    <a class="btn" href="/" target="_blank" rel="noopener">Открыть сайт ↗</a>
    <button class="btn primary" id="btnSave" type="button">Опубликовать</button>
    <button class="btn" id="btnOut" type="button">Выйти</button>
  </div>
  <div class="cols">
    <nav id="side" aria-label="Разделы"></nav>
    <section id="panel"></section>
    <aside id="pv">
      <div class="pvbar">
        <button class="btn sm on" data-d="desk" type="button">Компьютер</button>
        <button class="btn sm" data-d="phone" type="button">Телефон</button>
        <button class="btn sm mtabs" id="btnPvClose" type="button">Закрыть просмотр</button>
      </div>
      <div class="pvwrap" id="pvwrap"><iframe id="frame" src="/?preview=1" title="Предпросмотр"></iframe></div>
    </aside>
  </div>
</div>
<div id="toast"></div>

<script src="content.default.js"></script>
<script src="admin.js"></script>
</body>
</html>
