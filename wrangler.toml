name = "kate-portfolio"
main = "src/worker.js"
compatibility_date = "2026-10-03"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "kate-portfolio"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kate-portfolio-media"

[vars]
ADMIN_PASSWORD = "CHANGE_ME"
SESSION_SECRET = "CHANGE_ME_LONG_RANDOM_SECRET"
